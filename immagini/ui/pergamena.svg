<svg xmlns="http://www.w3.org/2000/svg" width="400" height="400" viewBox="0 0 400 400">
  <!-- Pergamena: base calda, macchie larghe e fibre sottili. Sostituibile con una texture vera. -->
  <filter id="f" x="0" y="0" width="100%" height="100%">
    <feTurbulence type="fractalNoise" baseFrequency="0.008" numOctaves="3" seed="5" stitchTiles="stitch" result="blot"/>
    <feColorMatrix in="blot" type="matrix" values="0 0 0 0 0.55  0 0 0 0 0.38  0 0 0 0 0.16  0 0 0 -1.2 0.7" result="stain"/>
    <feTurbulence type="fractalNoise" baseFrequency="0.6 0.05" numOctaves="2" seed="9" stitchTiles="stitch" result="fib"/>
    <feColorMatrix in="fib" type="matrix" values="0 0 0 0 0.4  0 0 0 0 0.28  0 0 0 0 0.12  0 0 0 -0.9 0.42" result="fibers"/>
    <feFlood flood-color="#e6d3a3" result="base"/>
    <feComposite in="stain" in2="base" operator="over" result="s1"/>
    <feComposite in="fibers" in2="s1" operator="over"/>
  </filter>
  <rect width="400" height="400" filter="url(#f)"/>
</svg>
