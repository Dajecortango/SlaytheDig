<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <base href="/">
    <title>Slay the Dig — Partita online</title>
    <link rel="stylesheet" href="css/wc3-base.css">
    <link rel="stylesheet" href="css/style.css">
    <style>
        #onlineJoin { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; z-index: 1200; background: rgba(0,0,0,.85); }
        #onlineJoin .wc-panel { padding: 24px; max-width: 360px; width: calc(100% - 32px); }
        #onlineJoinIndietro { width: 100%; margin-top: 8px; }
        /* Link del master (?master=<chiave>): si entra solo come master; senza, il pulsante del master non c'è */
        #onlineEntraMasterBtn, #onlineJoin.online-join-master #onlineEntraModeratoreBtn,
        #onlineJoin.online-join-master #onlineJoinIndietro { display: none; }
        #onlineJoin.online-join-master #onlineEntraMasterBtn { display: inline-block; }
        /* Pulsanti del master dentro la schermata specchiata (es. "Riprendi <eroe>" nella lobby): solo il master a distanza */
        html:not([data-ruolo="master"]) .online-solo-master { display: none !important; }
        /* Attesa (rosa.fase 'attesa'): copre i menu del master finché non apre la creazione del capitolo */
        #onlineAttesa { position: fixed; inset: 0; z-index: 40; display: flex; align-items: center; justify-content: center; background: rgba(0,0,0,.85); }
        #onlineAttesa .wc-panel { position: relative; padding: 28px 24px 22px; max-width: 380px; width: calc(100% - 32px); text-align: center; }
        #onlineAttesa p { margin: 10px 0 0; font-size: 1em; color: var(--text-main, #e8dcc0); }
        /* Scelta dell'eroe: pannello sopra la schermata del master, che resta visibile intorno */
        #onlineScelta { position: fixed; left: 50%; top: calc(var(--top-h, 56px) + 52px); transform: translateX(-50%); z-index: 1050;
            width: 560px; max-width: calc(100% - 32px); max-height: calc(100vh - var(--top-h, 56px) - 120px); overflow-y: auto; padding: 16px 16px 14px; }
        #onlineScelta .wc-heading { margin: 0 90px 10px 0; font-size: 1.15em; }
        .online-angolo { position: absolute; top: 8px; right: 8px; margin: 0; padding: 2px 8px; font-size: 0.75em; }
        .online-eroi { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 8px; }
        .online-eroe { display: grid; grid-template-columns: auto 1fr; grid-template-rows: auto auto; column-gap: 10px; align-items: center;
            margin: 0; padding: 8px 10px; min-width: 0; text-align: left; }
        .online-eroe .hero-portrait { grid-row: 1 / 3; width: 48px; height: 48px; flex-basis: 48px; }
        .online-eroe .hero-portrait > span { font-size: 1.5rem; }
        .online-eroe-nome { font-family: var(--font-title); font-size: 0.95em; color: var(--wc-yellow, gold); }
        .online-eroe-nota { font-size: 0.78em; color: var(--text-dim); text-transform: none; letter-spacing: normal; }
        .online-eroe.online-eroe-occupato { filter: grayscale(1) brightness(0.6); cursor: not-allowed; }
        /* Tutti gli eroi in gioco: il pannello si riduce a una riga */
        #onlineScelta.online-scelta-guarda { width: auto; padding: 10px 104px 10px 14px; }
        .online-scelta-testo { margin: 0; font-size: 0.9em; color: var(--text-main, #e8dcc0); }
        #onlineMasterAttesa { color: var(--wc-yellow, gold); }
        .online-join-hint { margin: 10px 0 0; font-size: 0.78em; color: var(--text-dim); line-height: 1.4; }
        /* Barra del giocatore: compatta, nella barra in alto accanto alle icone, sopra barra e console del gioco
           (z-index 1000): sempre raggiungibile e lontana dai pannelli centrali. Sui telefoni scende sotto la barra. */
        #onlineBar { position: fixed; left: 210px; top: 6px; z-index: 1100; display: flex; flex-wrap: wrap; gap: 6px; align-items: center; max-width: calc(50% - 360px); }
        #onlineBar .wc-panel { padding: 3px 10px; font-size: 0.85em; }
        #onlineBar .btn-small { padding: 2px 8px; }
        @media (max-width: 1100px) { #onlineBar { left: 8px; top: calc(var(--top-h, 56px) + 6px); max-width: calc(100% - 16px); } }
        #onlineBar .wc-panel { padding: 8px 14px; }
        #onlineBar button.mio { outline: 2px solid var(--wc-yellow, gold); }
        #onlineAvviso { position: fixed; top: calc(var(--top-h, 56px) + 8px); left: 50%; transform: translateX(-50%); z-index: 1100; }
        #onlineTurno { color: var(--wc-yellow, gold); font-weight: bold; }
        .online-hidden { display: none !important; }
        /* Il mio eroe (server/public/online.js, segnaEroi): cornice dorata che pulsa e targhetta "TU"; gli altri un poco spenti */
        .hero-mini-card { position: relative; }
        .hero-mini-card.online-mio { animation: online-mio 1.8s ease-in-out infinite; }
        .hero-mini-card.online-mio::before { content: "TU"; position: absolute; top: -9px; right: 8px; z-index: 2; padding: 1px 7px;
            font-family: var(--font-title); font-size: 0.72rem; font-weight: bold; letter-spacing: 0.08em; color: #1a1206;
            background: linear-gradient(#ffe27a, #c9982f); border: 1px solid #000; box-shadow: 0 0 6px rgba(255, 204, 0, 0.6); }
        .hero-mini-card.online-altro:not(.is-turn) { filter: brightness(0.8); }
        @keyframes online-mio {
            0%, 100% { box-shadow: 0 0 0 2px #c9982f, 0 0 10px rgba(255, 204, 0, 0.45), inset 0 0 18px rgba(0, 0, 0, 0.8); }
            50% { box-shadow: 0 0 0 2px #ffe27a, 0 0 18px rgba(255, 204, 0, 0.8), inset 0 0 18px rgba(0, 0, 0, 0.8); }
        }
        @media (prefers-reduced-motion: reduce) { .hero-mini-card.online-mio { animation: none; box-shadow: 0 0 0 2px #ffe27a, 0 0 12px rgba(255, 204, 0, 0.6); } }
        /* Turno di un altro giocatore: comandi grigi e chi deve agire */
        #onlineTurnoAltrui { margin: 0 0 6px; padding: 4px 10px; text-align: center; color: var(--wc-yellow, gold);
            font-family: var(--font-title); border: 1px dashed rgba(201, 152, 47, 0.7); background: rgba(0, 0, 0, 0.45); }
        .online-non-mio { filter: grayscale(1) brightness(0.6); cursor: not-allowed; }
        /* Pannello privato del moderatore: solo sul suo schermo, mai specchiato (niente regioni di onlineRegioni) */
        #onlineModPanel { position: fixed; right: 8px; top: calc(var(--top-h, 56px) + 8px); z-index: 1150;
            width: 290px; max-width: calc(100% - 16px); display: flex; flex-direction: column; align-items: flex-end; gap: 6px; }
        #onlineModToggle { margin: 0; }
        #onlineModBox { max-height: calc(100vh - 160px); overflow-y: auto; width: 100%; }
        #onlineModPanel .wc-panel { padding: 12px; }
        #onlineModPanel h3 { margin: 0 0 4px; font-size: 0.95em; }
        .onmod-row { display: flex; align-items: center; justify-content: space-between; gap: 6px; padding: 5px 0;
            border-bottom: 1px solid rgba(226, 185, 81, 0.15); flex-wrap: wrap; }
        .onmod-row:last-child { border-bottom: none; }
        .onmod-name { font-family: var(--font-title); font-size: 0.8em; color: var(--wc-yellow); }
        .onmod-controls { display: flex; align-items: center; gap: 3px; }
        .onmod-controls button { padding: 2px 7px; font-size: 0.72em; min-width: 0; margin: 0; }
        .onmod-controls input { width: 42px; text-align: center; padding: 2px; font-size: 0.78em; }
        .onmod-actions { display: flex; gap: 6px; margin: 8px 0 2px; flex-wrap: wrap; }
        .onmod-actions button { flex: 1; padding: 6px 8px; font-size: 0.74em; min-width: 0; margin: 0; }
    </style>
</head>
<body class="online-guest">
    <!-- Modulo d'ingresso: solo per il link del master e per il moderatore. Il giocatore entra da solo
         e sceglie l'eroe dal pannello #onlineScelta (server/public/online.js, disegnaScelta). -->
    <div id="onlineJoin" class="online-hidden">
        <div class="wc-panel">
            <h2 class="wc-heading" id="onlineJoinTitolo">Entra come Moderatore</h2>
            <p id="onlineJoinTesto">Il moderatore aiuta chi guida la partita: non gioca un eroe, ma può aprire il Pannello di Controllo (vita della squadra e del nemico, stati) da qui.</p>
            <button class="btn-proceed" id="onlineEntraMasterBtn">Entra come Master</button>
            <button class="btn-proceed" id="onlineEntraModeratoreBtn">Entra come Moderatore</button>
            <button class="btn-small" id="onlineJoinIndietro">Indietro</button>
            <p id="onlineJoinErrore" class="kw-curse"></p>
        </div>
    </div>
    <!-- Attesa: il master non è ancora nella creazione del capitolo (rosa.fase 'attesa') -->
    <div id="onlineAttesa" class="online-hidden">
        <div class="wc-panel">
            <button type="button" class="btn-small online-angolo" data-online-moderatore data-tip="Entra come Moderatore||Non giochi un eroe: aiuti chi guida la partita dal Pannello di Controllo">Moderatore</button>
            <h2 class="wc-heading">In attesa</h2>
            <p>Il master sta preparando il capitolo…</p>
        </div>
    </div>
    <!-- Scelta dell'eroe (giocatore senza eroe, in creazione o a partita avviata): sotto resta la schermata del master -->
    <div id="onlineScelta" class="wc-panel online-hidden">
        <button type="button" class="btn-small online-angolo" data-online-moderatore data-tip="Entra come Moderatore||Non giochi un eroe: aiuti chi guida la partita dal Pannello di Controllo">Moderatore</button>
        <div id="onlineSceltaCorpo"></div>
    </div>
    <div class="menu-scene" aria-hidden="true"></div>
    <div id="partyTopBar" class="party-topbar"></div>
    <div id="partyConsole" class="party-console"></div>
    <!-- Stessa struttura del gioco (index.html): .game-layout centra la schermata fra la barra in alto e la console -->
    <div class="game-layout">
        <div class="container" id="gameContainer"></div>
    </div>
    <div id="wc3Modal" class="modal-overlay hidden"></div>
    <div id="onlineOverlays"></div>
    <div id="onlineAvviso" class="online-hidden wc-panel"></div>
    <div id="onlineBar"></div>
    <!-- Pannello del moderatore: solo sui dati che arrivano via "gmstato" (SSE), mai una finestra specchiata.
         Il pulsante lo apre/chiude solo su questa pagina: nessuno (master o altri giocatori) lo vede o lo sa. -->
    <div id="onlineModPanel" class="online-hidden">
        <button type="button" class="btn-small" id="onlineModToggle">🛠 Pannello di Controllo</button>
        <div id="onlineModBox" class="wc-panel online-hidden">
            <h3 class="wc-heading">Pannello di Controllo</h3>
            <div id="onlineModBody"></div>
        </div>
    </div>
    <div id="wc3Tooltip" class="wc3-tooltip" role="tooltip"></div>
    <audio id="onlineMusica" loop preload="none"></audio>
    <script src="js/online-regole.js"></script>
    <script src="js/vendor/morphdom-umd.min.js"></script>
    <script src="online-client.js"></script>
</body>
</html>
