<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <base href="/">
    <title>Slay the Dig — Partita online</title>
    <link rel="stylesheet" href="css/wc3-base.css">
    <link rel="stylesheet" href="css/style.css">
    <style>
        #onlineJoin { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; z-index: 50; background: rgba(0,0,0,.85); }
        #onlineJoin .wc-panel { padding: 24px; max-width: 360px; width: calc(100% - 32px); }
        #onlineJoin input { width: 100%; margin: 12px 0; padding: 8px; font-size: 1.1em; }
        /* Barra del giocatore: compatta, nella barra in alto accanto alle icone, sopra barra e console del gioco
           (z-index 1000): sempre raggiungibile e lontana dai pannelli centrali. Sui telefoni scende sotto la barra. */
        #onlineBar { position: fixed; left: 210px; top: 6px; z-index: 1100; display: flex; flex-wrap: wrap; gap: 6px; align-items: center; max-width: calc(50% - 360px); }
        #onlineBar .wc-panel { padding: 3px 10px; font-size: 0.85em; }
        #onlineBar .btn-small { padding: 2px 8px; }
        @media (max-width: 1100px) { #onlineBar { left: 8px; top: calc(var(--top-h, 56px) + 6px); max-width: calc(100% - 16px); } }
        #onlineBar .wc-panel { padding: 8px 14px; }
        #onlineBar button.mio { outline: 2px solid var(--wc-yellow, gold); }
        #onlineAvviso { position: fixed; top: calc(var(--top-h, 56px) + 8px); left: 50%; transform: translateX(-50%); z-index: 1100; }
        #onlineTurno { color: var(--wc-yellow, gold); font-weight: bold; }
        .online-hidden { display: none !important; }
        /* Il mio eroe (server/public/online.js, segnaEroi): cornice dorata che pulsa e targhetta "TU"; gli altri un poco spenti */
        .hero-mini-card { position: relative; }
        .hero-mini-card.online-mio { animation: online-mio 1.8s ease-in-out infinite; }
        .hero-mini-card.online-mio::before { content: "TU"; position: absolute; top: -9px; right: 8px; z-index: 2; padding: 1px 7px;
            font-family: var(--font-title); font-size: 0.72rem; font-weight: bold; letter-spacing: 0.08em; color: #1a1206;
            background: linear-gradient(#ffe27a, #c9982f); border: 1px solid #000; box-shadow: 0 0 6px rgba(255, 204, 0, 0.6); }
        .hero-mini-card.online-altro:not(.is-turn) { opacity: 0.8; }
        @keyframes online-mio {
            0%, 100% { box-shadow: 0 0 0 2px #c9982f, 0 0 10px rgba(255, 204, 0, 0.45), inset 0 0 18px rgba(0, 0, 0, 0.8); }
            50% { box-shadow: 0 0 0 2px #ffe27a, 0 0 18px rgba(255, 204, 0, 0.8), inset 0 0 18px rgba(0, 0, 0, 0.8); }
        }
        @media (prefers-reduced-motion: reduce) { .hero-mini-card.online-mio { animation: none; box-shadow: 0 0 0 2px #ffe27a, 0 0 12px rgba(255, 204, 0, 0.6); } }
        /* Turno di un altro giocatore: comandi grigi e chi deve agire */
        #onlineTurnoAltrui { margin: 0 0 6px; padding: 4px 10px; text-align: center; color: var(--wc-yellow, gold);
            font-family: var(--font-title); border: 1px dashed rgba(201, 152, 47, 0.7); background: rgba(0, 0, 0, 0.45); }
        .online-non-mio { filter: grayscale(1) brightness(0.6); cursor: not-allowed; }
    </style>
</head>
<body class="online-guest">
    <div id="onlineJoin" class="online-hidden">
        <div class="wc-panel">
            <h2 class="wc-heading">Unisciti alla spedizione</h2>
            <p>Scrivi il tuo nome: il master ti assegnerà un eroe.</p>
            <input id="onlineNome" maxlength="24" autocomplete="nickname">
            <button class="btn-proceed" id="onlineEntraBtn">Entra</button>
            <p id="onlineJoinErrore" class="kw-curse"></p>
        </div>
    </div>
    <div class="menu-scene" aria-hidden="true"></div>
    <div id="partyTopBar" class="party-topbar"></div>
    <div id="partyConsole" class="party-console"></div>
    <!-- Stessa struttura del gioco (index.html): .game-layout centra la schermata fra la barra in alto e la console -->
    <div class="game-layout">
        <div class="container" id="gameContainer"></div>
    </div>
    <div id="wc3Modal" class="modal-overlay hidden"></div>
    <div id="onlineOverlays"></div>
    <div id="onlineAvviso" class="online-hidden wc-panel"></div>
    <div id="onlineBar"></div>
    <div id="wc3Tooltip" class="wc3-tooltip" role="tooltip"></div>
    <audio id="onlineMusica" loop preload="none"></audio>
    <script src="js/online-regole.js"></script>
    <script src="js/vendor/morphdom-umd.min.js"></script>
    <script src="online-client.js"></script>
</body>
</html>
