<svg xmlns="http://www.w3.org/2000/svg" width="320" height="320" viewBox="0 0 320 320">
  <!-- Pietra scura in rilievo (rumore + luce radente), ripetibile. Sostituibile con una texture vera. -->
  <filter id="f" x="0" y="0" width="100%" height="100%">
    <feTurbulence type="fractalNoise" baseFrequency="0.022 0.03" numOctaves="5" seed="7" stitchTiles="stitch" result="n"/>
    <feDiffuseLighting in="n" lighting-color="#ffffff" surfaceScale="4" result="l">
      <feDistantLight azimuth="225" elevation="48"/>
    </feDiffuseLighting>
    <feColorMatrix in="l" type="matrix" values="0.42 0 0 0 -0.08  0.38 0 0 0 -0.08  0.33 0 0 0 -0.08  0 0 0 0 1"/>
  </filter>
  <rect width="320" height="320" filter="url(#f)"/>
</svg>
