<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Scheda Eroe — Slay the Dig</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700;900&family=Marcellus&family=Metamorphous&family=Skranji:wght@700&display=swap" rel="stylesheet">
<!-- Base comune con gioco ed editor: colori, caratteri, pulsanti in metallo, componenti .wc-* -->
<link rel="stylesheet" href="/css/wc3-base.css">
<style>
    :root { --bg:#120f0c; --text: var(--text-main); --dim: var(--text-dim); }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    body {
        margin: 0; min-height: 100vh; background: radial-gradient(circle at top, #221a10, var(--bg));
        color: var(--text); font-family: var(--font-body); padding: 16px;
        background: radial-gradient(ellipse at top, #2a1f12, var(--bg) 70%) fixed;
    }
    h1 { font-size: 1.15rem; margin: 6px 0 4px; justify-content: center; }
    .status { text-align: center; font-size: 0.8rem; color: var(--dim); margin-bottom: 16px; }
    .hidden { display: none; }
    /* Pannello: cornice dorata del gioco, più sottile per lo schermo del telefono */
    .panel {
        border: 14px solid transparent;
        border-image: var(--frame) var(--frame-slice) / 14px stretch;
        background: var(--noise-fine), radial-gradient(ellipse at 50% 0%, rgba(110, 80, 40, 0.28), transparent 60%), linear-gradient(#171412, #0c0a09);
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.8);
        padding: 8px 6px; margin-bottom: 14px;
    }
    /* I pulsanti prendono il metallo di wc3-base.css: qui solo misure da dito */
    button { margin: 0; letter-spacing: 0.04em; }
    /* Stile ripreso dalla card della Compagnia nel gioco principale (.hero-mini-card in css/style.css) */
    .hero-card-top { display: flex; gap: 12px; align-items: center; margin-bottom: 12px; }
    .hero-portrait-mini {
        width: 58px; height: 58px; flex: 0 0 58px;
        display: grid; place-items: center;
        background: radial-gradient(circle at 40% 28%, hsl(var(--hue, 30) 55% 44%), hsl(var(--hue, 30) 60% 12%) 78%);
        border: 1px solid #000;
        box-shadow: 0 0 0 2px #b8923e, 0 0 0 3px #000, inset 0 0 14px rgba(0,0,0,0.85);
        font-family: var(--font-title); font-weight: 900; font-size: 1.7rem; color: #ffe9a8;
        text-shadow: 0 2px 0 #000, 0 0 12px rgba(0,0,0,0.9);
    }
    .hero-card-info { flex: 1; min-width: 0; }
    .hero-card-title { font-family: var(--font-title); font-weight: 700; color: var(--wc-yellow); text-shadow: 0 1px 0 #000; margin-bottom: 4px; }
    .mini-bar-container {
        position: relative; height: 13px; margin-bottom: 4px;
        background: #0a0605; border: 1px solid #000; box-shadow: 0 0 0 1px #4a3a22, inset 0 2px 4px rgba(0,0,0,0.9);
        overflow: hidden;
    }
    .mini-bar-container.armor { height: 8px; }
    .mini-bar-fill { height: 100%; background: linear-gradient(#8dff78, #22b01c 50%, #0c6a0a); box-shadow: inset 0 1px 0 rgba(255,255,255,0.45); transition: width 0.35s; }
    .mini-bar-fill.hp-mid { background: linear-gradient(#fff28a, #d8b40a 50%, #7a6205); }
    .mini-bar-fill.hp-low { background: linear-gradient(#ff9a8a, #d0180f 50%, #6a0805); }
    .mini-bar-fill.armor-fill { background: linear-gradient(#b8dcff, #2f6fd6 50%, #123a80); }
    .mini-bar-text { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; font-size: 0.6rem; color: #fff; text-shadow: 0 1px 1px #000; }

    .hero-stats-row {
        display: flex; justify-content: space-between; padding: 4px 6px; margin-bottom: 8px;
        font-size: 0.78rem; color: #f3e2b0; background: rgba(0,0,0,0.4);
        border-top: 1px solid rgba(226,185,81,0.18); border-bottom: 1px solid rgba(226,185,81,0.18);
    }
    .hero-stats-row i { font-style: normal; font-weight: 700; font-size: 0.6rem; color: var(--dim); margin-right: 3px; }
    .hero-ability-line { font-size: 0.72rem; color: #e0bcff; }
    .items { font-size: 0.85rem; line-height: 1.6; }
    /* Zaino: icone come nel gioco, bordo del colore della rarità, pozioni utilizzabili fuori dal combattimento */
    .bag-title { font-family: var(--font-title); font-size: 0.8rem; color: var(--wc-yellow); margin-bottom: 8px; letter-spacing: 0.08em; text-transform: uppercase; }
    .bag-item { display: flex; align-items: center; gap: 10px; padding: 6px 0; border-bottom: 1px solid rgba(226,185,81,0.12); }
    .bag-item:last-child { border-bottom: none; }
    .bag-icon { width: 40px; height: 40px; flex: 0 0 40px; border: 2px solid #8d8a84; box-shadow: 0 0 0 1px #000; background: #0a0605; object-fit: cover; }
    .bag-icon[class*="rar-"] { border-color: var(--rar); box-shadow: 0 0 0 1px #000, 0 0 8px var(--rar-glow); }
    .bag-text b { color: var(--rar, #f3e2b0); }
    .bag-text { flex: 1; min-width: 0; line-height: 1.3; }
    .bag-text b { color: #f3e2b0; }
    .bag-text small { display: block; color: var(--dim); font-size: 0.72rem; }
    .use-btn { padding: 8px 12px; font-size: 0.75rem; background: var(--noise-fine), linear-gradient(#236628, #103816 55%, #0a240d); }
    .use-btn:disabled { opacity: 0.35; }
    .use-target { margin-top: 8px; display: flex; gap: 6px; flex-wrap: wrap; }
    .use-target button { flex: 1; padding: 10px 8px; font-size: 0.75rem; }
    .bag-note { font-size: 0.72rem; color: var(--dim); margin-top: 6px; }
    .hero-portrait-mini { overflow: hidden; }
    .hero-portrait-mini img { width: 100%; height: 100%; object-fit: cover; object-position: 50% 30%; }
    .hero-ability-desc { font-size: 0.7rem; color: var(--dim); margin-top: 2px; }
    .roll-area { text-align: center; }
    .roll-btn { width: 100%; padding: 18px; font-size: 1.05rem; opacity: 0.45; }
    .roll-btn.active { opacity: 1; background: var(--noise-fine), linear-gradient(#236628, #103816 55%, #0a240d); animation: pulse 1.2s infinite; }
    @keyframes pulse { 0%,100% { box-shadow: 0 0 0 0 rgba(212,175,55,0.6);} 50% { box-shadow: 0 0 0 10px rgba(212,175,55,0);} }
    .empty { text-align: center; color: var(--dim); padding: 30px 10px; }

    .dice-row { display: flex; justify-content: center; gap: 12px; margin-bottom: 14px; min-height: 60px; align-items: center; }
    .dice-box {
        width: 56px; height: 56px;
        display: grid; place-items: center;
        font-family: var(--font-title); font-size: 1.8rem; font-weight: 900; color: var(--wc-yellow);
        background: linear-gradient(#2a1d0c, #120f0c);
        border: 2px solid #b8923e;
        box-shadow: 0 0 0 1px #000, inset 0 0 10px rgba(0,0,0,0.6);
    }
    .dice-box.hidden { display: none; }
    .dice-box.rolling { animation: diceShake 0.15s infinite; color: #fff; }
    .dice-box.landed { animation: diceLand 0.3s ease; }
    @keyframes diceShake {
        0% { transform: rotate(-8deg) scale(1); }
        50% { transform: rotate(8deg) scale(1.08); }
        100% { transform: rotate(-8deg) scale(1); }
    }
    @keyframes diceLand {
        0% { transform: scale(1.4); }
        100% { transform: scale(1); }
    }
    .roll-result-text { font-family: var(--font-title); font-size: 0.9rem; color: var(--wc-yellow); margin-top: 4px; min-height: 1.2em; }

    .action-title { font-family: var(--font-title); font-size: 0.85rem; color: var(--wc-yellow); margin-bottom: 10px; text-align: center; letter-spacing: 0.06em; }
    .action-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    .action-btn, .item-btn, .back-btn { padding: 14px 8px; font-size: 0.82rem; text-align: center; }
    .action-grid { gap: 12px 8px; }
    .item-list { display: flex; flex-direction: column; gap: 12px; margin-bottom: 14px; }
    .item-btn { text-align: left; font-family: var(--font-body); text-transform: none; letter-spacing: 0; font-size: 0.9rem; }
    .back-btn { width: 100%; font-size: 0.72rem; background: var(--noise-fine), linear-gradient(#2a221a, #15110d 55%, #0c0a08); color: var(--text-dim); }
</style>
</head>
<body>
    <h1 id="heroName" class="wc-heading">Connessione...</h1>
    <div class="status" id="statusText">In attesa di dati dal gioco...</div>
    <div id="content"></div>
    <div class="panel roll-area hidden" id="actionPanel"></div>

    <script>
        function slugify(name) {
            var diacritics = new RegExp('[\\u0300-\\u036f]', 'g');
            return name.toLowerCase().normalize('NFD').replace(diacritics, '')
                .replace(/[^a-z0-9]+/g, '-').replace(/(^-|-$)/g, '');
        }
        const slug = decodeURIComponent(location.pathname.split('/').filter(Boolean).pop() || '');

        // Stessa formula di heroHue() in js/game.js: colore del ritratto coerente col gioco principale.
        function heroHue(name) {
            let hash = 0;
            for (const ch of name) hash = (hash * 31 + ch.charCodeAt(0)) % 360;
            return hash;
        }

        function barClass(pct) { return pct > 60 ? '' : (pct > 30 ? 'hp-mid' : 'hp-low'); }
        function clampPct(value, max) { return max > 0 ? Math.max(0, Math.min(100, (value / max) * 100)) : 0; }

        // ngrok (piano gratuito) mostra una pagina di avviso al primo accesso da un browser nuovo:
        // questo header dice a ngrok di saltarla anche per le chiamate fetch/EventSource successive
        // (senza, quelle richieste ricevono la pagina HTML dell'avviso invece dei dati JSON veri).
        const NGROK_SKIP_HEADER = { 'ngrok-skip-browser-warning': 'true' };

        let currentHero = null;
        let lastPendingRoll = null;
        let lastPendingAction = null;
        let lastResultDisplay = null; // { rolls } — ultimo tiro completato, mostrato finché non arriva un nuovo turno
        let itemPickState = null;     // { stage: 'item' } oppure { stage: 'target', itemIndex, itemName }
        let rollInProgress = false;   // true durante l'animazione del dado: nessun aggiornamento la deve interrompere
        let bagUseIndex = null;       // pozione dello zaino di cui si sta scegliendo il bersaglio
        let bagMessage = '';
        let lastState = null;

        function renderBag(hero, state) {
            const items = hero.items || [];
            if (!items.length) return '<div class="bag-title">Zaino</div><div>Zaino vuoto</div>';
            const rows = items.map((it, idx) => {
                const targets = bagTargets(state, it);
                const rar = it.rarity || 'comune';
                const icon = it.icon ? `<img class="bag-icon rar-${rar}" src="/${it.icon}" alt="">` : `<span class="bag-icon rar-${rar}"></span>`;
                // Danni e potenziamenti si usano solo nel turno di combattimento ("Usa oggetto")
                const useBtn = it.consumable && !it.combatOnly
                    ? `<button class="use-btn" onclick="startBagUse(${idx})" ${state.inCombat || hero.hp <= 0 ? 'disabled' : ''}>Usa</button>` : '';
                const target = bagUseIndex === idx
                    ? `<div class="use-target">${targets.map((a, ai) => `<button onclick="useBagItem(${idx}, ${ai})">${a.name} (${a.hp}/${a.maxHp})</button>`).join('')}<button onclick="cancelBagUse()">Annulla</button></div>`
                    : '';
                return `<div class="bag-item rar-${rar}">${icon}<div class="bag-text"><b>${it.name}${(it.qty || 1) > 1 ? ` x${it.qty}` : ''}</b><small>${it.desc || ''}</small>${target}</div>${useBtn}</div>`;
            }).join('');
            const note = state.inCombat ? 'In combattimento le pozioni si usano nel tuo turno ("Usa oggetto").' : bagMessage;
            return `<div class="bag-title">Zaino</div>${rows}${note ? `<div class="bag-note">${note}</div>` : ''}`;
        }

        // Bersagli di una pozione dello zaino: gli eroi vivi, anche i caduti se la pozione rialza
        function bagTargets(state, item) {
            if (item && Array.isArray(item.targets)) return (state.heroes || []).filter(h => item.targets.includes(h.name));
            return (state.heroes || []).filter(h => h.hp > 0 || (item && item.revives));
        }

        function startBagUse(idx) { bagUseIndex = idx; bagMessage = ''; if (lastState) renderHero(lastState); }
        function cancelBagUse() { bagUseIndex = null; if (lastState) renderHero(lastState); }

        // targetIdx: posizione del bersaglio fra quelli possibili (evita di mettere nomi negli attributi onclick)
        function useBagItem(idx, targetIdx) {
            if (!currentHero || !lastState) return;
            const target = bagTargets(lastState, (currentHero.items || [])[idx])[targetIdx];
            if (!target) return;
            bagUseIndex = null;
            bagMessage = 'Pozione in uso...';
            renderHero(lastState);
            fetch('/api/item-use', {
                method: 'POST',
                headers: Object.assign({ 'Content-Type': 'application/json' }, NGROK_SKIP_HEADER),
                body: JSON.stringify({ heroName: currentHero.name, itemIndex: idx, targetName: target.name })
            }).then(r => r.json()).then(data => {
                bagMessage = data && data.ok ? `Usata su ${target.name}.` : ((data && data.error) || 'Non è stato possibile usarla.');
                if (lastState) renderHero(lastState);
            }).catch(() => { bagMessage = 'Connessione persa.'; if (lastState) renderHero(lastState); });
        }

        function renderHero(state) {
            lastState = state;
            const hero = (state.heroes || []).find(h => slugify(h.name) === slug);
            currentHero = hero || null;
            const content = document.getElementById('content');

            if (!hero) {
                document.getElementById('heroName').textContent = 'Eroe non trovato';
                document.getElementById('statusText').textContent = 'Nessun eroe con questo nome nella partita in corso.';
                content.innerHTML = '<div class="panel empty">Controlla il link oppure aspetta che la partita venga avviata sul PC.</div>';
                document.getElementById('actionPanel').classList.add('hidden');
                return;
            }
            document.getElementById('heroName').textContent = hero.name;
            document.getElementById('statusText').textContent = state.campaignTitle ? `In viaggio: ${state.campaignTitle}` : 'Connesso';

            const hpPct = clampPct(hero.hp, hero.maxHp);
            const armorMax = Math.max(hero.base_armor, hero.current_armor);
            const armorPct = clampPct(hero.current_armor, armorMax);

            content.innerHTML = `
                <div class="panel">
                    <div class="hero-card-top">
                        <div class="hero-portrait-mini" style="--hue:${heroHue(hero.name)}">${hero.portrait ? `<img src="/${hero.portrait}" alt=""${hero.portraitPos ? ` style="object-position:${hero.portraitPos}; transform-origin:${hero.portraitPos}; transform:scale(${hero.portraitZoom || 1});"` : ''}>` : hero.name.charAt(0)}</div>
                        <div class="hero-card-info">
                            <div class="hero-card-title">${hero.name}</div>
                            <div class="mini-bar-container">
                                <div class="mini-bar-fill ${barClass(hpPct)}" style="width:${hpPct}%"></div>
                                <div class="mini-bar-text">${hero.hp} / ${hero.maxHp}</div>
                            </div>
                            <div class="mini-bar-container armor">
                                <div class="mini-bar-fill armor-fill" style="width:${armorPct}%"></div>
                            </div>
                        </div>
                    </div>
                    <div class="hero-stats-row">
                        <span><i>FOR</i>${hero.str}</span>
                        <span><i>INT</i>${hero.int}</span>
                        <span><i>FED</i>${hero.fth}</span>
                        <span><i>DAN</i>${hero.dmg}</span>
                    </div>
                    ${hero.chosenAbility ? `<div class="hero-ability-line">★ ${hero.chosenAbility}</div>${hero.abilityDesc ? `<div class="hero-ability-desc">${hero.abilityDesc}</div>` : ''}` : ''}
                </div>
                <div class="panel items">${renderBag(hero, state)}</div>`;

            document.getElementById('actionPanel').classList.remove('hidden');
            renderActionArea();
        }

        /* ---------- Pannello azione: sceglie cosa mostrare a seconda dello stato attuale ---------- */
        function renderActionArea() {
            const panel = document.getElementById('actionPanel');
            if (!panel || !currentHero || rollInProgress) return;

            if (lastPendingRoll && slugify(lastPendingRoll.heroName) === slug) {
                renderRollPanel(panel, lastPendingRoll);
                return;
            }
            if (itemPickState) {
                renderItemPickPanel(panel, itemPickState);
                return;
            }
            if (lastPendingAction && slugify(lastPendingAction.heroName) === slug) {
                renderActionChoicePanel(panel, lastPendingAction);
                return;
            }
            if (lastResultDisplay) {
                renderResultPanel(panel, lastResultDisplay);
                return;
            }
            panel.innerHTML = `<button class="roll-btn" disabled>In attesa del tuo turno...</button>`;
        }

        function renderActionChoicePanel(panel, pendingAction) {
            const hasItems = pendingAction.consumables && pendingAction.consumables.length > 0;
            panel.innerHTML = `
                <div class="action-title">Scegli l'azione di ${currentHero.name}</div>
                <div class="action-grid">
                    <button class="action-btn" data-action="attack">⚔️ Attacca</button>
                    <button class="action-btn" data-action="defend">🛡️ Difendi</button>
                    <button class="action-btn" data-action="help">🤝 Aiuta</button>
                    <button class="action-btn" data-action="ability" ${pendingAction.canUseAbility ? '' : 'disabled'}>★ ${pendingAction.abilityLabel || 'Abilità'}</button>
                </div>
                <div class="action-grid" style="margin-top:8px;">
                    <button class="action-btn" data-action="use_item" style="grid-column:1 / -1;" ${hasItems ? '' : 'disabled'}>🧪 Usa un oggetto</button>
                </div>`;
            panel.querySelectorAll('.action-btn[data-action]').forEach(btn => {
                btn.addEventListener('click', () => {
                    const action = btn.dataset.action;
                    if (action === 'use_item') {
                        itemPickState = { stage: 'item' };
                        renderActionArea();
                    } else {
                        submitAction(pendingAction.requestId, action);
                    }
                });
            });
        }

        function renderItemPickPanel(panel, state) {
            if (state.stage === 'item') {
                const items = (lastPendingAction && lastPendingAction.consumables) || [];
                panel.innerHTML = `
                    <div class="action-title">Scegli l'oggetto</div>
                    <div class="item-list">${items.map(it =>
                        `<button class="item-btn" data-idx="${it.index}">${it.name}${it.desc ? ` — ${it.desc}` : ''}</button>`
                    ).join('')}</div>
                    <button class="back-btn" id="backBtn">← Indietro</button>`;
                panel.querySelectorAll('.item-btn').forEach(btn => {
                    btn.addEventListener('click', () => {
                        itemPickState = { stage: 'target', itemIndex: parseInt(btn.dataset.idx, 10) };
                        renderActionArea();
                    });
                });
                const back = document.getElementById('backBtn');
                if (back) back.addEventListener('click', () => { itemPickState = null; renderActionArea(); });
            } else {
                const chosen = ((lastPendingAction && lastPendingAction.consumables) || []).find(it => it.index === state.itemIndex);
                const allies = (chosen && chosen.targets) || (lastPendingAction && lastPendingAction.livingAllies) || [];
                panel.innerHTML = `
                    <div class="action-title">Su chi usarlo?</div>
                    <div class="item-list">${allies.map(name => `<button class="item-btn" data-name="${name}">${name}</button>`).join('')}</div>
                    <button class="back-btn" id="backBtn">← Indietro</button>`;
                panel.querySelectorAll('.item-btn').forEach(btn => {
                    btn.addEventListener('click', () => {
                        const requestId = lastPendingAction ? lastPendingAction.requestId : null;
                        const itemIndex = state.itemIndex;
                        itemPickState = null;
                        if (requestId) submitAction(requestId, 'use_item', itemIndex, btn.dataset.name);
                    });
                });
                const back = document.getElementById('backBtn');
                if (back) back.addEventListener('click', () => { itemPickState = { stage: 'item' }; renderActionArea(); });
            }
        }

        function renderRollPanel(panel, pendingRoll) {
            panel.innerHTML = `
                <div class="dice-row">
                    <div class="dice-box" id="phoneDice1">—</div>
                    <div class="dice-box ${pendingRoll.diceCount === 2 ? '' : 'hidden'}" id="phoneDice2">—</div>
                </div>
                <button class="roll-btn active" id="rollBtn">TIRA — ${pendingRoll.label}${pendingRoll.diceCount === 2 ? ' (2 dadi)' : ''}</button>
                <div class="roll-result-text" id="rollResultText"></div>`;
            const btn = document.getElementById('rollBtn');
            if (btn) btn.onclick = () => submitRoll(pendingRoll.requestId, pendingRoll.diceCount);
        }

        function renderResultPanel(panel, result) {
            panel.innerHTML = `
                <div class="dice-row">
                    <div class="dice-box">${result.rolls[0]}</div>
                    ${result.rolls.length > 1 ? `<div class="dice-box">${result.rolls[1]}</div>` : ''}
                </div>
                <button class="roll-btn" disabled>In attesa del tuo turno...</button>
                <div class="roll-result-text">Hai tirato: ${result.rolls.join(' , ')}</div>`;
        }

        /* ---------- Invio della scelta d'azione (e, per "usa oggetto", di oggetto+bersaglio) ---------- */
        function submitAction(requestId, action, itemIndex, targetName) {
            const panel = document.getElementById('actionPanel');
            if (panel) panel.innerHTML = `<button class="roll-btn" disabled>Invio in corso...</button>`;

            const body = { requestId, action };
            if (typeof itemIndex === 'number') body.itemIndex = itemIndex;
            if (targetName) body.targetName = targetName;

            fetch('/api/action', {
                method: 'POST',
                headers: Object.assign({ 'Content-Type': 'application/json' }, NGROK_SKIP_HEADER),
                body: JSON.stringify(body)
            }).then(r => r.json()).then(result => {
                lastPendingAction = null;
                if (result && result.action === 'use_item') {
                    lastResultDisplay = null;
                    renderActionArea(); // torna a "in attesa": l'oggetto non richiede un tiro
                }
                // Per le altre azioni non serve fare nulla qui: a breve arriva il pending-roll
                // (via SSE o al prossimo polling) e renderActionArea() mostrerà i dadi da tirare.
            }).catch(() => {
                fetchState(); // esito incerto: richiedi lo stato vero invece di indovinarlo
            });
        }

        // Attiva/disattiva la scelta dell'azione a seconda di chi deve agire in questo momento.
        function applyPendingAction(pendingAction) {
            // Confronta il requestId: lo stesso turno può arrivare più volte (poll ogni 5s, SSE) mentre
            // il giocatore sta ancora scegliendo l'oggetto/bersaglio — non bisogna interrompere quella scelta.
            const isNewTurn = pendingAction && (!lastPendingAction || lastPendingAction.requestId !== pendingAction.requestId);
            lastPendingAction = pendingAction || null;
            if (isNewTurn) { itemPickState = null; lastResultDisplay = null; }
            if (!pendingAction) itemPickState = null; // turno risolto altrove: azzera anche una scelta oggetto a metà
            renderActionArea();
        }

        // Attiva/disattiva il pulsante del dado a seconda di chi deve tirare in questo momento.
        function applyPendingRoll(pendingRoll) {
            lastPendingRoll = pendingRoll || null;
            if (rollInProgress) return;
            if (lastPendingRoll) lastResultDisplay = null;
            renderActionArea();
        }

        // Durata minima dell'animazione: se la risposta del server arriva prima, si aspetta comunque
        // questo tanto per dare il tempo di "vedere" il dado girare; se arriva dopo, si aspetta lei.
        const MIN_ROLL_ANIM_MS = 650;

        function submitRoll(requestId, diceCount) {
            const btn = document.getElementById('rollBtn');
            const dice1 = document.getElementById('phoneDice1');
            const dice2 = document.getElementById('phoneDice2');
            rollInProgress = true;

            if (btn) { btn.disabled = true; btn.classList.remove('active'); btn.textContent = 'Tiro in corso...'; }
            dice1.classList.remove('landed'); dice1.classList.add('rolling');
            if (diceCount === 2) { dice2.classList.remove('hidden', 'landed'); dice2.classList.add('rolling'); }

            const flickerTimer = setInterval(() => {
                dice1.textContent = 1 + Math.floor(Math.random() * 6);
                if (diceCount === 2) dice2.textContent = 1 + Math.floor(Math.random() * 6);
            }, 80);

            const startedAt = Date.now();
            const settle = (rolls, errorText) => {
                const wait = Math.max(0, MIN_ROLL_ANIM_MS - (Date.now() - startedAt));
                setTimeout(() => {
                    clearInterval(flickerTimer);
                    rollInProgress = false;

                    if (rolls) {
                        dice1.classList.remove('rolling'); dice1.textContent = rolls[0]; dice1.classList.add('landed');
                        if (rolls.length > 1) {
                            dice2.classList.remove('rolling', 'hidden');
                            dice2.textContent = rolls[1]; dice2.classList.add('landed');
                        }
                        const resultText = document.getElementById('rollResultText');
                        if (resultText) resultText.textContent = `Hai tirato: ${rolls.join(' , ')}`;
                        // Il tiro è già risolto lato server: si ricorda il risultato e si torna in
                        // attesa del prossimo turno, senza aspettare l'evento pending-roll (ridondante).
                        lastPendingRoll = null;
                        lastResultDisplay = { rolls };
                    } else {
                        dice1.classList.remove('rolling');
                        dice2.classList.remove('rolling');
                        if (btn) { btn.disabled = false; btn.classList.add('active'); btn.textContent = 'Riprova'; }
                        const resultText = document.getElementById('rollResultText');
                        if (resultText) resultText.textContent = errorText || 'Errore, riprova.';
                        // Esito incerto (rete/409): si richiede lo stato vero al server invece di indovinarlo
                        fetchState();
                    }
                }, wait);
            };

            fetch('/api/roll', {
                method: 'POST',
                headers: Object.assign({ 'Content-Type': 'application/json' }, NGROK_SKIP_HEADER),
                body: JSON.stringify({ requestId })
            }).then(r => r.json()).then(result => {
                if (result && result.rolls) settle(result.rolls, null);
                else settle(null, result && result.error);
            }).catch(() => settle(null, 'Errore di connessione, riprova dal PC.'));
        }

        function fetchState() {
            fetch('/api/state', { headers: NGROK_SKIP_HEADER }).then(r => r.json()).then(state => {
                renderHero(state);
                applyPendingAction(state.pendingAction);
                applyPendingRoll(state.pendingRoll);
            }).catch(() => {
                document.getElementById('statusText').textContent = 'Connessione al server persa, nuovo tentativo...';
            });
        }

        fetchState();
        setInterval(fetchState, 5000); // rete di sicurezza se lo stream live si interrompe

        if (window.EventSource) {
            // EventSource non supporta header personalizzati: si passa lo stesso avviso come
            // parametro nell'URL, che ngrok accetta come alternativa all'header.
            const es = new EventSource('/api/events?ngrok-skip-browser-warning=true');
            es.addEventListener('state', e => { try { renderHero(JSON.parse(e.data)); } catch (err) {} });
            es.addEventListener('pending-action', e => { try { applyPendingAction(JSON.parse(e.data)); } catch (err) {} });
            es.addEventListener('pending-roll', e => { try { applyPendingRoll(JSON.parse(e.data)); } catch (err) {} });
        }
    </script>
</body>
</html>
