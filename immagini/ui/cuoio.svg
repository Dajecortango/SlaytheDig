<svg xmlns="http://www.w3.org/2000/svg" width="240" height="240" viewBox="0 0 240 240">
  <!-- Cuoio scuro: grana fine in rilievo con macchie più calde. Sostituibile con una texture vera. -->
  <filter id="f" x="0" y="0" width="100%" height="100%">
    <feTurbulence type="fractalNoise" baseFrequency="0.09" numOctaves="4" seed="3" stitchTiles="stitch" result="grain"/>
    <feDiffuseLighting in="grain" lighting-color="#ffffff" surfaceScale="1.6" result="l">
      <feDistantLight azimuth="235" elevation="60"/>
    </feDiffuseLighting>
    <feColorMatrix in="l" type="matrix" values="0.36 0 0 0 -0.06  0.24 0 0 0 -0.06  0.15 0 0 0 -0.05  0 0 0 0 1" result="c"/>
    <feTurbulence type="fractalNoise" baseFrequency="0.012" numOctaves="2" seed="11" stitchTiles="stitch" result="blot"/>
    <feColorMatrix in="blot" type="matrix" values="0 0 0 0 0.25  0 0 0 0 0.12  0 0 0 0 0.04  0 0 0 -1.4 0.75" result="b"/>
    <feComposite in="b" in2="c" operator="over"/>
  </filter>
  <rect width="240" height="240" filter="url(#f)"/>
</svg>
